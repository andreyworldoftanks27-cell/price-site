{% extends "base.html" %}
{% block title %}{{ t.login_title }} — {{ t.site_title }}{% endblock %}
{% block content %}
<div class="login-box">
    <h1>{{ t.login_title }}</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
        <input type="password" name="password" placeholder="{{ t.login_password_placeholder }}" autofocus required>
        <button type="submit">{{ t.login_button }}</button>
    </form>
</div>
{% endblock %}
