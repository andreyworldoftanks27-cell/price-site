<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Реестр цен{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <a href="/" class="logo">Реестр цен</a>
        {% if request.session.get("logged_in") %}
        <nav>
            <a href="/">Каталог</a>
            <a href="/duplicates">Дубликаты</a>
            <a href="/logout">Выйти</a>
        </nav>
        {% endif %}
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
