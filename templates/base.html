<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ t.site_title }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css?v={{ css_version }}">
    <script>
        (function () {
            var saved = localStorage.getItem("theme") || "dark";
            document.documentElement.setAttribute("data-theme", saved);
        })();
    </script>
</head>
<body>
    <!-- Спрайт категорійних іконок товарів (див. material_icon_key у main.py
         та .material-icon/.material-icon-svg у style.css). Один набір
         <symbol> на весь каркас сторінки — і catalog.html, і history.html
         посилаються на нього через <use href="#icon-...">, не дублюючи
         розмітку іконок на кожній сторінці окремо. -->
    <svg style="display:none" aria-hidden="true">
        <symbol id="icon-default" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 20 7v10l-8 4-8-4V7z"/><path d="M12 3v18M4 7l8 4 8-4"/>
        </symbol>
        <symbol id="icon-glue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6M10 3v3l-2 2v11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V8l-2-2V3"/><path d="M9 13h6"/>
        </symbol>
        <symbol id="icon-cement" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8h12l1 12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/><path d="M6 13h12"/>
        </symbol>
        <symbol id="icon-paint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 9h14l-1.5 10a2 2 0 0 1-2 1.7H8.5a2 2 0 0 1-2-1.7z"/><path d="M5 9 4 6h16l-1 3"/><path d="M12 3v3"/>
        </symbol>
        <symbol id="icon-pipe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="5" cy="12" rx="2.3" ry="5"/><path d="M5 7h12.5M5 17h12.5"/><ellipse cx="19" cy="12" rx="2.3" ry="5"/>
        </symbol>
        <symbol id="icon-fasteners" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6l-1 4h-4z"/><path d="M11 7v12l1 2 1-2V7"/><path d="M9.5 9.5h5M9.5 12h5M9.5 14.5h5"/>
        </symbol>
        <symbol id="icon-insulation" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="1"/><path d="M6 8c1.5 1.4 3 1.4 4.5 0s3-1.4 4.5 0 3 1.4 4.5 0M6 13c1.5 1.4 3 1.4 4.5 0s3-1.4 4.5 0 3 1.4 4.5 0M6 18c1.5 1.4 3 1.4 4.5 0s3-1.4 4.5 0 3 1.4 4.5 0"/>
        </symbol>
        <symbol id="icon-sheet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="13" width="14" height="4"/><rect x="5" y="8.5" width="14" height="4"/><rect x="7" y="4" width="14" height="4"/>
        </symbol>
        <symbol id="icon-waterproof" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/>
        </symbol>
        <symbol id="icon-masonry" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <rect x="3" y="5" width="8" height="4"/><rect x="13" y="5" width="8" height="4"/><rect x="3" y="13" width="8" height="4"/><rect x="13" y="13" width="8" height="4"/><rect x="8" y="9" width="8" height="4"/>
        </symbol>
        <symbol id="icon-metal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20 20 4M4 14 14 4M10 20 20 10"/>
        </symbol>
        <symbol id="icon-roofing" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 13 12 5l9 8"/><path d="M5 13v6h14v-6"/><path d="M8 13v2M12 13v2M16 13v2"/>
        </symbol>
        <symbol id="icon-bulk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18c2-6 5-9 9-9s7 3 9 9"/><path d="M3 18h18"/>
        </symbol>
        <symbol id="icon-plumbing" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 10h8a4 4 0 0 1 4 4v1"/><path d="M5 7v6"/><path d="M17 15v3"/><path d="M14 21h6"/>
        </symbol>
        <symbol id="icon-electrical" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 4 14h6l-1 8 10-13h-6z"/>
        </symbol>
        <symbol id="icon-tile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/>
        </symbol>
        <symbol id="icon-tools" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 7a3 3 0 1 0-4 4L4 17l3 3 6-6a3 3 0 0 0 4-4l-3-3-2 2z"/>
        </symbol>
    </svg>
    <div class="app-shell">
        <aside class="sidebar">
            <a href="/" class="logo">{{ t.site_title }}</a>
            {% if request.session.get("logged_in") %}
            <nav class="sidebar-nav">
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">{{ t.nav_catalog }}</a>
                <a href="/duplicates" class="{% if request.url.path == '/duplicates' %}active{% endif %}">{{ t.nav_duplicates }}</a>
                <a href="/favorites" class="{% if request.url.path == '/favorites' %}active{% endif %}">{{ t.nav_favorites }}</a>
                <a href="/logout">{{ t.nav_logout }}</a>
            </nav>
            {% endif %}
            <div class="sidebar-bottom">
                <span class="lang-toggle">
                    <a href="/set-lang/uk?back={{ url_quote(request.url.path + ('?' + request.url.query if request.url.query else '')) }}" class="{% if lang == 'uk' %}active{% endif %}">UA</a>
                    <a href="/set-lang/ru?back={{ url_quote(request.url.path + ('?' + request.url.query if request.url.query else '')) }}" class="{% if lang == 'ru' %}active{% endif %}">RU</a>
                </span>
                <button class="theme-toggle" onclick="toggleTheme()" id="themeToggleBtn" type="button">
                    <span id="themeIcon">🌙</span> <span id="themeLabel">{{ t.theme_dark }}</span>
                </button>
            </div>
        </aside>
        <div class="main-area">
            <main class="container">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script>
        var THEME_LABELS = { dark: {{ t.theme_dark|tojson }}, light: {{ t.theme_light|tojson }} };
        function applyThemeLabel(theme) {
            document.getElementById("themeIcon").textContent = theme === "dark" ? "🌙" : "☀️";
            document.getElementById("themeLabel").textContent = THEME_LABELS[theme];
        }
        function toggleTheme() {
            var current = document.documentElement.getAttribute("data-theme") || "dark";
            var next = current === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
            applyThemeLabel(next);
        }
        applyThemeLabel(document.documentElement.getAttribute("data-theme") || "dark");
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
