<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Реестр цен{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Ставим тему ДО отрисовки страницы, чтобы не было "мигания" не той темой
        (function () {
            var saved = localStorage.getItem("theme") || "dark";
            document.documentElement.setAttribute("data-theme", saved);
        })();
    </script>
</head>
<body>
    <header class="topbar">
        <a href="/" class="logo">Реестр цен</a>
        <nav>
            {% if request.session.get("logged_in") %}
            <a href="/">Каталог</a>
            <a href="/duplicates">Дубликаты</a>
            <a href="/logout">Выйти</a>
            {% endif %}
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggleBtn" type="button">
                <span id="themeIcon">🌙</span> <span id="themeLabel">Тёмная</span>
            </button>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script>
        function applyThemeLabel(theme) {
            document.getElementById("themeIcon").textContent = theme === "dark" ? "🌙" : "☀️";
            document.getElementById("themeLabel").textContent = theme === "dark" ? "Тёмная" : "Светлая";
        }
        function toggleTheme() {
            var current = document.documentElement.getAttribute("data-theme") || "dark";
            var next = current === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
            applyThemeLabel(next);
        }
        applyThemeLabel(document.documentElement.getAttribute("data-theme") || "dark");
    </script>
</body>
</html>
